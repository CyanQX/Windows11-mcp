name: Windows EXE setup

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'skills/**'
      - 'scripts/build_setup.py'
      - 'scripts/build_portable.py'
      - 'scripts/build_windows_installer.py'
      - 'scripts/smoke_setup.py'
      - 'scripts/smoke_portable.py'
      - 'scripts/smoke_gui.py'
      - 'scripts/smoke_windows_installer.py'
      - 'scripts/verify_setup_source.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/setup.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'
      - name: Install locked build dependencies
        run: uv sync --frozen --extra dev --extra browser --extra installer --group build
      - name: Check installer source and configuration rollback
        run: |
          uv run --frozen --extra dev --extra browser --extra installer --group build ruff check src tests scripts installer
          uv run --frozen --extra dev --extra browser --extra installer --group build pytest tests/test_installer.py tests/test_docs.py tests/test_install_state.py tests/test_uninstall_safe.py tests/test_recovery.py tests/test_health_update.py tests/test_manager_settings.py tests/test_installer_ui.py tests/test_portable.py
      - name: Build standalone GUI and MCP service
        run: uv run --frozen --extra dev --extra browser --extra installer --group build python scripts/build_setup.py
      - name: Verify actual EXE installation and stdio connection
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/setup -Force | Out-Null
          Copy-Item -LiteralPath build/payload/setup-source-verification.json -Destination dist/setup/setup-source-verification.json
          uv run --frozen --extra dev --extra browser --extra installer --group build python scripts/smoke_setup.py build/payload/Windows-MCP.exe --output dist/setup/setup-validation.json
      - name: Build installation wizard and portable ZIP
        shell: pwsh
        run: |
          uv run --frozen --extra dev --extra browser --extra installer --group build python scripts/build_windows_installer.py build/payload/Windows-MCP.exe --out dist/setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen --extra dev --extra browser --extra installer --group build python scripts/build_portable.py build/payload/Windows-MCP.exe --out dist/setup
      - name: Verify chosen installation directory, system uninstall and extracted portable EXE
        shell: pwsh
        run: |
          $wizardPackage = Get-ChildItem -LiteralPath dist/setup -Filter 'Windows-MCP-Setup-v*-x64.exe' | Select-Object -First 1
          $portablePackage = Get-ChildItem -LiteralPath dist/setup -Filter 'Windows-MCP-Portable-v*-x64.zip' | Select-Object -First 1
          uv run --frozen --extra dev --extra browser --extra installer --group build python scripts/smoke_windows_installer.py $wizardPackage.FullName --payload build/payload/Windows-MCP.exe --output dist/setup/installer-validation.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen --extra dev --extra browser --extra installer --group build python scripts/smoke_portable.py $portablePackage.FullName --output dist/setup/portable-validation.json
      - name: Verify real Qt pages in isolated temporary homes
        run: uv run --frozen --extra dev --extra browser --extra installer --group build python scripts/smoke_gui.py build/payload/Windows-MCP.exe --out build/visual
      - name: Save native visual acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-mcp-ui
          path: build/visual/*
      - name: Save executable and validation record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-mcp-setup
          path: dist/setup/*
