name: Release

on:
  push:
    tags:
      - 'v*'

# PyPI publishing is intentionally omitted: the PyPI package name "windows-mcp" belongs to the
# upstream project (CursorTouch/Windows-MCP). Publish under a new package name if this fork is
# ever released to PyPI.
jobs:
  tests:
    name: Verify Windows release source
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    name: Build and create GitHub Release
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.13"

      - name: Build package
        run: uv build

      - name: Verify tag, package metadata and complete runtime source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project python scripts/verify_distribution.py --dist dist --tag "$RELEASE_TAG" > dist/distribution-verification.json
          uv run --no-project python -c "from pathlib import Path; text = Path('README.md').read_text(encoding='utf-8'); Path('release-notes.md').write_text(text, encoding='utf-8')"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Windows-MCP $RELEASE_TAG" --notes-file release-notes.md --latest
