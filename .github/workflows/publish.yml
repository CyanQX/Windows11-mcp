name: Release

on:
  push:
    tags:
      - 'v*'

# PyPI publishing is intentionally omitted: the PyPI package name "windows-mcp" belongs to the
# upstream project (CursorTouch/Windows-MCP). Publish under a new package name if this fork is
# ever released to PyPI.
jobs:
  release:
    name: Build and create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build package
        run: uv build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/* --title "Release ${{ github.ref_name }}" --generate-notes
