name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run --frozen --extra dev ruff check src tests

      # tests/desktop (real mouse/keyboard input) is skipped here: it needs an interactive
      # desktop and runs only with WINDOWS_MCP_DESKTOP_TESTS=1.
      - name: Run unit tests
        run: uv run --frozen --extra dev pytest
