[project]
name = "windows-mcp"
version = "1.5.0"
description = "MCP server that operates the real Windows desktop: genuine mouse/keyboard input and UI Automation actions, verified after every step."
authors = [
    { name = "Jeomon George", email = "jeogeoalukka@gmail.com" }
]
readme = "README.md"
license = { file = "LICENSE.md" }
keywords = ["windows", "mcp", "ai", "desktop", "ai agent"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: System :: Shells",
]
dependencies = [
    "click>=8.5.0",
    "comtypes>=1.4.17",
    "dxcam>=0.3.0",
    "fastmcp>=4.1.3",
    "markdownify>=1.1.0",
    "pillow>=13.0.0",
    "platformdirs>=4.13.5",
    "posthog>=7.75.11",
    "psutil>=7.0.0",
    "pygments>=2.21.0",
    "pywin32>=311",
    "requests>=2.33.0",
    "tabulate>=0.9.0",
    "thefuzz>=0.22.1",
    "uuid7>=0.1.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.64.1,<2"]
capture = ["windows-capture>=2.0.1,<3; sys_platform == 'win32' and platform_machine == 'AMD64'"]
ocr = [
    "pytesseract>=0.3.13,<0.4",
    "winrt-Windows.Media.Ocr>=4!10.0.28000,<5!0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=4!10.0.28000,<5!0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=4!10.0.28000,<5!0; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=4!10.0.28000,<5!0; sys_platform == 'win32'",
]
installer = [
    "pyside6-essentials>=6.9,<7",
    "tomlkit>=0.15.2,<1",
    "ruamel.yaml>=0.18,<0.20",
    "json5>=0.12,<1",
    "packaging>=26.3,<27",
    "jsonschema>=4.23,<5",
]
dev = [
    "ruff>=0.17.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/CyanQX/Windows11-mcp"
Repository = "https://github.com/CyanQX/Windows11-mcp"
Issues = "https://github.com/CyanQX/Windows11-mcp/issues"
Upstream = "https://github.com/CursorTouch/Windows-MCP"

[project.scripts]
windows-mcp = "windows_mcp.__main__:main"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
build = ["pyinstaller>=6,<7"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Vendored from yinkaisheng/Python-UIAutomation-for-Windows: kept close to upstream on purpose.
"src/windows_mcp/uia/*.py" = ["F401", "F403", "F405", "F841", "W292"]
# Package __init__ modules re-export their public API.
"src/windows_mcp/**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
constraint-dependencies = ["pydantic-settings>=2.14.2"]

[tool.uv.extra-build-dependencies]
pyperclip = ["setuptools"]
